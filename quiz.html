<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Lo Stendardo di Ur</title>
    <style>
        :root {
            --lapis-blue: #1d3557;
            --calcare-red: #e63946;
            --shell-beige: #f1faee;
            --bitumen-black: #111111;
            --gold: #e9c46a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--shell-beige);
            color: var(--bitumen-black);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: white;
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 30px;
            border-top: 8px solid var(--lapis-blue);
        }
        h1 {
            color: var(--lapis-blue);
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-style: italic;
        }
        .question-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--lapis-blue);
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-label:hover {
            background-color: #e9ecef;
        }
        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .btn-submit {
            background-color: var(--lapis-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #14243b;
        }
        #result-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: var(--lapis-blue);
            color: white;
            border-radius: 8px;
        }
        .score {
            font-size: 2em;
            font-weight: bold;
            color: var(--gold);
        }
        .correct-answer {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
        }
        .wrong-answer {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Quiz: Lo Stendardo di Ur</h1>
    <p class="subtitle">Metti alla prova la tua conoscenza sul capolavoro dell'arte sumera</p>
    
    <form id="quiz-form">
        <!-- Generazione delle 16 domande -->
        <div id="questions-wrapper"></div>
        <button type="button" class="btn-submit" onclick="calculateScore()">Invia e vedi i risultati</button>
    </form>

    <div id="result-container">
        <h2>Risultato Finale</h2>
        <p>Hai totalizzato <span class="score" id="score-display">0</span> su 16.</p>
        <p id="feedback-message"></p>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "1. In quale necropoli è stato ritrovato lo Stendardo di Ur?",
            options: ["Necropoli reale di Tebe", "Necropoli reale di Ur", "Valle dei Re", "Necropoli di Giza"],
            a: 1
        },
        {
            q: "2. A quale periodo risale storicamente lo Stendardo di Ur?",
            options: ["1000 a.C.", "1500 a.C.", "2500 a.C. circa", "3500 a.C."],
            a: 2
        },
        {
            q: "3. Da quanti pannelli principali di legno è costituito l'oggetto?",
            options: ["Due", "Tre", "Quattro", "Sei"],
            a: 2
        },
        {
            q: "4. Qual era la funzione originaria e accertata dello Stendardo?",
            options: ["Cassa di risonanza per arpa", "Stendardo da processione", "Scatola per gioielli regali", "Non è ancora conosciuta con certezza"],
            a: 3
        },
        {
            q: "5. Quali di questi materiali preziosi NON è stato usato per l'intarsio?",
            options: ["Lapislazzuli", "Oro zecchino", "Conchiglie marine", "Pietra calcarea rossastra"],
            a: 1
        },
        {
            q: "6. Con quale materiale sono legati tra loro gli intarsi?",
            options: ["Argilla cruda", "Pasta nera di bitume", "Stucco di gesso", "Resina di pino"],
            a: 1
        },
        {
            q: "7. In quanti registri (fasce) sono divisi i due pannelli principali?",
            options: ["Due", "Tre", "Quattro", "Cinque"],
            a: 1
        },
        {
            q: "8. Quali sono i due temi contrapposti raffigurati sui pannelli principali?",
            options: ["Guerra e Pace", "Vita e Morte", "Terra e Cielo", "Caccia e Agricoltura"],
            a: 0
        },
        {
            q: "9. In che direzione vanno 'lette' le scene dei pannelli?",
            options: ["Da destra a sinistra, dall'alto al basso", "Da sinistra a destra, dal basso verso l'alto", "A spirale dal centro verso l'esterno", "Dall'alto verso il basso"],
            a: 1
        },
        {
            q: "10. Cosa è raffigurato nella fascia più bassa del Pannello della guerra?",
            options: ["Soldati in marcia", "Schiavi che portano armi", "Quattro carri militari trainati da asini", "Il re che punisce i prigionieri"],
            a: 2
        },
        {
            q: "11. Nel Pannello della guerra, come viene evidenziato il re rispetto agli altri personaggi?",
            options: ["Indossa un mantello d'oro", "Raffigurato più alto in virtù del suo ruolo", "È l'unico a cavallo", "Ha un'aureola di lapislazzuli"],
            a: 1
        },
        {
            q: "12. Cos'è il 'kaunakes' indossato dai personaggi nel Pannello della pace?",
            options: ["Un elmetto di bronzo", "Una sottana di vello di pecora", "Una collana di conchiglie", "Un mantello di pelle bovina"],
            a: 1
        },
        {
            q: "13. Chi allieta gli ospiti nel registro superiore del Pannello della pace?",
            options: ["Dei danzatori", "Un arpista e una cantante", "Dei giocolieri", "Un flautista"],
            a: 1
        },
        {
            q: "14. Secondo il testo, lo stile della pittura sumera in quest'opera:",
            options: ["Ricerca la prospettiva perfetta", "Evita ogni forma di illusionismo e profondità", "Usa il chiaroscuro per dare volume", "È identico in tutto e per tutto a quello egizio"],
            a: 1
        },
        {
            q: "15. Come viene rappresentato l'occhio delle figure umane nello Stendardo?",
            options: ["Di profilo", "Chiuso", "Sempre in posizione frontale", "Stilizzato a forma di mandorla cava"],
            a: 2
        },
        {
            q: "16. Rispetto alla pittura egizia (che è longilinea), come appaiono le figure sumere?",
            options: ["Ancora più allungate", "Molto realistiche", "Brevilinee e tarchiate", "Quasi astratte"],
            a: 2
        }
    ];

    const wrapper = document.getElementById("questions-wrapper");

    // Genera l'HTML per le domande
    quizData.forEach((item, index) => {
        let optionsHtml = '';
        item.options.forEach((opt, optIndex) => {
            optionsHtml += `
                <label class="option-label" id="label-q${index}-o${optIndex}">
                    <input type="radio" name="q${index}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });

        const questionHtml = `
            <div class="question-block" id="question-${index}">
                <div class="question-text">${item.q}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
            </div>
        `;
        wrapper.innerHTML += questionHtml;
    });

    function calculateScore() {
        let score = 0;
        
        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            
            // Resetta colori precedenti (in caso di doppio click)
            item.options.forEach((_, optIndex) => {
                document.getElementById(`label-q${index}-o${optIndex}`).classList.remove('correct-answer', 'wrong-answer');
            });

            // Evidenzia la risposta corretta sempre
            document.getElementById(`label-q${index}-o${item.a}`).classList.add('correct-answer');

            if (selected) {
                const selectedValue = parseInt(selected.value);
                if (selectedValue === item.a) {
                    score++;
                } else {
                    // Segna in rosso quella sbagliata
                    document.getElementById(`label-q${index}-o${selectedValue}`).classList.add('wrong-answer');
                }
            }
        });

        // Mostra il risultato
        const resultContainer = document.getElementById("result-container");
        const scoreDisplay = document.getElementById("score-display");
        const feedbackMsg = document.getElementById("feedback-message");
        
        scoreDisplay.textContent = score;
        resultContainer.style.display = "block";

        if (score === 16) {
            feedbackMsg.textContent = "Perfetto! Hai una conoscenza da vero archeologo mesopotamico!";
        } else if (score >= 11) {
            feedbackMsg.textContent = "Ottimo lavoro! Conosci molto bene l'arte sumera.";
        } else if (score >= 6) {
            feedbackMsg.textContent = "Discreto, ma puoi ripassare alcuni dettagli di quest'opera magnifica.";
        } else {
            feedbackMsg.textContent = "Forse è il caso di rileggere gli appunti sullo Stendardo di Ur!";
        }
        
        // Scrolla in basso per far vedere il risultato
        resultContainer.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
