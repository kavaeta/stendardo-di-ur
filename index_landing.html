<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo Stendardo di Ur</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Evita lo scroll della pagina principale */
        }

        /* Sfondo a schermo intero con l'immagine */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('faccia della guerra.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Overlay scuro per leggere bene il testo e far risaltare il menu */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 40%, rgba(15, 23, 42, 0.4) 100%);
            z-index: -1;
            backdrop-filter: blur(2px);
        }

        /* Stile del Titolo */
        .main-title {
            font-family: 'Cinzel', serif;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        /* Layout con Sidebar e Area Contenuti */
        .layout-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Menu Laterale */
        .sidebar {
            width: 320px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        /* Voci del menu */
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .nav-btn:hover {
            background: rgba(16, 185, 129, 0.2); /* Verde smeraldo (Mappa) */
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateX(5px);
            color: white;
        }
        
        .nav-btn.quiz-btn:hover {
            background: rgba(59, 130, 246, 0.2); /* Blu (Quiz) */
            border-color: rgba(59, 130, 246, 0.5);
        }

        .nav-btn.active {
            background: rgba(16, 185, 129, 0.8);
            border-color: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .nav-btn.quiz-btn.active {
            background: rgba(26, 115, 232, 0.9);
            border-color: #1a73e8;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
        }

        /* Area dei contenuti (iframe) */
        .content-area {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Messaggio iniziale (Welcome state) */
        .welcome-state {
            text-align: center;
            color: white;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 1s ease-out;
        }

        /* Iframe container */
        .iframe-container {
            width: 100%;
            height: 100%;
            display: none; /* Nascosto all'inizio */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: rgba(255, 255, 255, 0.95); /* Sfondo bianco per iframe quiz/mappa se necessario */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .layout-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                padding: 1rem;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .welcome-state {
                display: none; /* Nascondi su mobile per dare spazio ai contenuti */
            }
            .main-title {
                width: 100%;
                text-align: center;
                margin-bottom: 1rem;
                font-size: 1.8rem;
            }
            .nav-btn {
                width: auto;
                flex: 1;
                min-width: 140px;
                margin: 0.5rem;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Sfondo & Overlay -->
    <div class="bg-image" id="bg-img"></div>
    <div class="bg-overlay"></div>

    <div class="layout-container">
        
        <!-- Sidebar (Menu Laterale) -->
        <aside class="sidebar">
            <h1 class="main-title text-4xl font-bold text-white mb-2 mt-4">
                LO STENDARDO<br>
                <span class="text-3xl text-emerald-400">DI UR</span>
            </h1>
            <p class="text-slate-300 text-sm mb-10 opacity-80">Esplorazione interattiva del capolavoro sumero</p>

            <nav class="flex flex-col gap-2 w-full">
                <!-- Bottone Mappa Mentale -->
                <button class="nav-btn" onclick="loadContent('index_2.html', this, 'map')">
                    <i class="fa-solid fa-sitemap text-2xl w-8 text-center text-emerald-400"></i>
                    <span>Mappa Mentale</span>
                </button>

                <!-- Bottone Quiz -->
                <button class="nav-btn quiz-btn" onclick="loadContent('quiz_2.html', this, 'quiz')">
                    <i class="fa-solid fa-gamepad text-2xl w-8 text-center text-blue-400"></i>
                    <span>Quiz Interattivo</span>
                </button>
            </nav>

            <div class="mt-auto pt-6 border-t border-slate-700/50">
                <button class="text-slate-400 hover:text-white text-sm flex items-center gap-2 transition" onclick="resetView()">
                    <i class="fa-solid fa-house"></i> Torna alla Home
                </button>
            </div>
        </aside>

        <!-- Area Contenuti -->
        <main class="content-area">
            
            <!-- Welcome State (Messaggio Iniziale) -->
            <div id="welcome-message" class="welcome-state">
                <h2 class="text-5xl font-serif text-white mb-6 drop-shadow-lg">Scopri l'antica Mesopotamia</h2>
                <p class="text-xl text-slate-200 mb-8 font-light drop-shadow-md">
                    Seleziona una voce dal menu a sinistra per iniziare. <br>
                    Puoi esplorare le connessioni tramite la <strong>Mappa Mentale</strong> o mettere alla prova le tue conoscenze con il <strong>Quiz</strong>.
                </p>
                <i class="fa-solid fa-arrow-left text-3xl text-emerald-400 animate-pulse hidden md:inline-block"></i>
            </div>

            <!-- Iframe Container per i contenuti esterni -->
            <div id="content-container" class="iframe-container">
                <iframe id="main-iframe" src="about:blank" title="Contenuto Interattivo"></iframe>
            </div>

        </main>
    </div>

    <script>
        const welcomeMessage = document.getElementById('welcome-message');
        const contentContainer = document.getElementById('content-container');
        const mainIframe = document.getElementById('main-iframe');
        const bgImg = document.getElementById('bg-img');

        function loadContent(url, btnElement, type) {
            // Rimuovi classe active da tutti i bottoni
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Aggiungi active al bottone cliccato
            btnElement.classList.add('active');

            // Effetto grafico sullo sfondo
            if(type === 'map') {
                bgImg.style.transform = "scale(1.05) translateX(20px)";
                bgImg.style.filter = "blur(4px)";
            } else {
                bgImg.style.transform = "scale(1.05) translateX(-20px)";
                bgImg.style.filter = "blur(8px) grayscale(50%)"; // Effetto focus per il quiz
            }

            // Nascondi welcome, mostra iframe con fade
            welcomeMessage.style.display = 'none';
            
            // Carica l'URL
            mainIframe.src = url;
            
            // Mostra il contenitore
            contentContainer.style.display = 'block';
            
            // Trigger reflow per animazione CSS
            void contentContainer.offsetWidth; 
            contentContainer.style.opacity = '1';
        }

        function resetView() {
            // Rimuovi active dai bottoni
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Resetta sfondo
            bgImg.style.transform = "scale(1) translateX(0)";
            bgImg.style.filter = "none";

            // Nascondi iframe, mostra welcome
            contentContainer.style.opacity = '0';
            setTimeout(() => {
                contentContainer.style.display = 'none';
                mainIframe.src = "about:blank";
                welcomeMessage.style.display = 'block';
            }, 500); // Attendi fine animazione fade out
        }
    </script>
</body>
</html>
